esphome:
  name: st25r-ring-test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: components
    components: [st25r, st25r_spi, st25r_i2c]

spi:
  clk_pin: GPIO19
  miso_pin: GPIO10
  mosi_pin: GPIO18

st25r_spi:
  id: my_st25r
  cs_pin: GPIO6
  irq_pin: GPIO7
  rf_power: 15
  supply_3v3: false
  update_interval: 100ms
  on_tag:
    then:
      - output.turn_on: out_2
      - output.turn_on: out_15
      - logger.log:
          format: "Tag detected: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - output.turn_off: out_2
      - output.turn_off: out_15
      - logger.log:
          format: "Tag removed: %s"
          args: ['x.c_str()']

output:
  - platform: gpio
    pin: GPIO2
    id: out_2
  - platform: gpio
    pin: GPIO15
    id: out_15
