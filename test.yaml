esphome:
  name: test_st25r

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

spi:
  clk_pin: GPIO19
  miso_pin: GPIO10
  mosi_pin: GPIO18

external_components:
  - source:
      type: local
      path: components

st25r_spi:
  id: my_st25r
  cs_pin: GPIO6
  irq_pin: GPIO7
  supply_3v3: false
  update_interval: 1s
  known_uids:
    - "05876446D71200"
  on_tag:
    then:
      - logger.log: "Tag detected!"

binary_sensor:
  - platform: st25r
    uid: "05-87-64-46-D7-12-00"
    name: "My Tag"

logger:
  level: VERY_VERBOSE
  hardware_uart: USB_SERIAL_JTAG
