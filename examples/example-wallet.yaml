# ST25R NFC Reader — Phone & Wallet Pass Example
#
# How to use Google Wallet or Apple Wallet as a stable NFC credential —
# no special app required, no HCE configuration needed.
#
# ══════════════════════════════════════════════════════════════════════════════
# HOW IT WORKS
# ══════════════════════════════════════════════════════════════════════════════
# Phones randomise their ISO 14443A UID on every tap for privacy.  Instead of
# relying on the UID, the reader reads a stable credential directly from the
# wallet pass that lives inside Google Wallet or Apple Wallet.
#
# The reader attempts three protocols in order, stopping at the first success:
#   1. NFC Forum T4T NDEF   (standard NFC tags / Android HCE apps)
#   2. Google Smart Tap 2.0 (Google Wallet generic/loyalty passes)
#   3. Apple VAS URL mode   (Apple Wallet .pkpass passes)
#
# For wallet passes the reader sends SELECT + GET DATA without a reader public
# key, requesting plaintext.  Passes whose issuer configured no-auth mode
# return their credential string in cleartext.  Payment passes (Google Pay,
# Apple Pay) always require certified merchant authentication and are skipped.
#
# ══════════════════════════════════════════════════════════════════════════════
# "MERCHANT NAME" IS NOT THE CREDENTIAL — READ THIS FIRST
# ══════════════════════════════════════════════════════════════════════════════
# The "merchant name" or "issuer name" shown on a Google Wallet pass card
# (e.g. "door", "My Company", "Acme Corp") is a DISPLAY-ONLY field.
# The reader does NOT query by merchant name and the name is NOT returned by
# Smart Tap.
#
# What Smart Tap returns is a separate field called  smartTapRedemptionValue
# — a string that YOU set when creating the pass via the Google Wallet API.
# That string is what appears in ESPHome logs and is used as the 'uid' in your
# binary sensor.  Example:
#
#   Pass created with:   smartTapRedemptionValue = "alice@home"
#   Reader logs:         Smart Tap: smartTapRedemptionValue = "alice@home"
#   binary_sensor uid:   "alice@home"
#
# ══════════════════════════════════════════════════════════════════════════════
# DOES THE TOKEN REPRESENT THE PERSON OR THE PHONE?
# ══════════════════════════════════════════════════════════════════════════════
# The wallet pass is tied to the person's Google or Apple account, NOT to the
# phone hardware.  When Alice gets a new phone:
#   • She signs into her Google / Apple account on the new phone.
#   • Her passes re-appear in Google Wallet / Apple Wallet automatically.
#   • She taps the new phone — the reader reads the same credential as before.
#   • No re-enrollment needed.
#
# ══════════════════════════════════════════════════════════════════════════════
# GOOGLE WALLET SETUP
# ══════════════════════════════════════════════════════════════════════════════
# Cost: FREE — requires a Google account only.
#
# 1. Create a Google Wallet Issuer account:
#    a. Go to https://console.cloud.google.com/ and create a project.
#    b. Enable the "Google Wallet API" on that project.
#    c. Go to https://pay.google.com/business/console/ and create an issuer.
#    d. Note your ISSUER ID — a large decimal number shown in the console,
#       e.g. 3388000000022304.  This goes in smart_tap_collector_id below.
#
# 2. Create a "Generic" pass class and object via the Wallet REST API.
#    Required Smart Tap fields on the OBJECT (not just the class):
#      "smartTapRedemptionValue": "alice@home"   ← the string returned to on_tag
#      "redemptionIssuers": [3388000000022304]   ← your issuer ID from step 1d
#    The "issuerName" / "merchantName" field shown on the card is separate and
#    is purely cosmetic — it plays no role in the Smart Tap exchange.
#
# 3. Generate a "Save to Google Wallet" JWT link and send it to the user.
#    When they click it, the pass is added to their Google Wallet.
#
# 4. Set smart_tap_collector_id in the YAML below to your issuer ID from step 1d.
#
# 5. Tap the phone with logger: DEBUG — ESPHome logs will show:
#      Smart Tap: SELECT OSE.GST OK
#      Smart Tap: NEGOTIATE OK (collectorId=0x000C095E38801720)
#      Smart Tap: GET DATA body (NN bytes): E2 xx E3 xx 82 0A ...
#      Smart Tap: smartTapRedemptionValue = "alice@home"
#
# 6. Use "alice@home" as the uid in the binary_sensor below.
#
# Quick-start pass builder: https://developers.google.com/wallet/generic/web/
#
# ══════════════════════════════════════════════════════════════════════════════
# APPLE WALLET SETUP
# ══════════════════════════════════════════════════════════════════════════════
# Cost: requires an Apple Developer account ($99/year) OR a third-party pass
#       issuer service (many have free tiers: PassKit.com, WalletPasses.com, etc.)
#
# 1. Create a .pkpass file with an NFC section configured for URL-based VAS:
#      "nfc": {
#        "message": "https://yoursite.com/pass/alice",  ← stable pass URL
#        "requiresAuthentication": false                 ← no reader auth = cleartext
#      }
#
# 2. Sign the .pkpass with your Pass Type Certificate and distribute it to the
#    user (email, web download, or AirDrop).
#
# 3. The user adds the pass to Apple Wallet by opening the .pkpass file on iOS.
#
# 4. Tap the phone — check ESPHome logs for:
#      [I][st25r:???]: Apple VAS: pass URL = https://yoursite.com/pass/alice
#
# 5. Use "https://yoursite.com/pass/alice" as the uid in the binary_sensor.
#
# Third-party pass issuers: https://passkit.com , https://walletpasses.com
#
# ══════════════════════════════════════════════════════════════════════════════
# WHAT DOES NOT WORK (expected limitations)
# ══════════════════════════════════════════════════════════════════════════════
# • Google Pay / Apple Pay (payment passes): require certified merchant
#   authentication — SW=6985 is returned and the reader falls back gracefully.
# • Transit passes, airline boarding passes: often require reader auth too.
# • Passes with requiresAuthentication:true (Google) / without "nfc" key (Apple).
# • Passes whose redemptionIssuers does NOT include your smart_tap_collector_id.
# ══════════════════════════════════════════════════════════════════════════════

esphome:
  name: st25r-wallet-example
  friendly_name: ST25R Wallet Example

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6

logger:
  # Set DEBUG to trace every APDU exchange — useful during initial wallet setup.
  level: INFO

wifi:
  ssid: "WIFI_SSID"
  password: "WIFI_PASSWORD"

external_components:
  - source: github://JohnMcLear/esphome_st25r
    components: [st25r, st25r_spi]

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO10

st25r_spi:
  id: nfc_reader
  cs_pin: GPIO6
  irq_pin: GPIO7
  update_interval: 1s

  # smart_tap_collector_id: your Google Wallet issuer ID from pay.google.com/business/console
  # This is the numeric issuer ID (a large decimal integer) that must also appear
  # in the pass's redemptionIssuers list for the pass to respond to this reader.
  # Default (0) acts as an anonymous reader — only works if you explicitly put 0
  # in the pass's redemptionIssuers, which is not normal.
  # Set this to your real issuer ID once you have a Google Wallet API account.
  # Accepts decimal:   smart_tap_collector_id: 3388000000022304
  # Or 0x-prefixed hex: smart_tap_collector_id: 0x000C095E38801720
  smart_tap_collector_id: 0   # ← replace with your issuer ID

  on_tag:
    then:
      - logger.log:
          format: "NFC token: %s"
          args: ['x.c_str()']
      # Forward token to Home Assistant for automations:
      - homeassistant.event:
          event: esphome.nfc_token
          data:
            token: !lambda 'return x;'

  on_tag_removed:
    then:
      - logger.log:
          format: "NFC removed: %s"
          args: ['x.c_str()']

# binary_sensor uid is exactly the string that appears in logs after first tap.
#
# Google Wallet pass with smartTapRedemptionValue = "alice@home":
#   uid: "alice@home"
#
# Apple Wallet pass with VAS URL = "https://yoursite.com/pass/alice":
#   uid: "https://yoursite.com/pass/alice"
#
binary_sensor:
  - platform: st25r
    st25r_id: nfc_reader
    name: "Alice's Phone"
    uid: "alice@home"

  - platform: st25r
    st25r_id: nfc_reader
    name: "Bob's Phone"
    uid: "https://yoursite.com/pass/bob"
