# ST25R NFC Reader — Phone & Wallet Pass Example
#
# This configuration documents how to use a phone as a stable NFC credential
# with the ST25R reader, and explains the important limitations and trade-offs.
#
# ══════════════════════════════════════════════════════════════════════════════
# THE CORE PROBLEM
# ══════════════════════════════════════════════════════════════════════════════
# Phones randomise their ISO 14443A UID on every tap for privacy.  Tracking a
# phone by its UID is therefore impossible.
#
# ══════════════════════════════════════════════════════════════════════════════
# HOW THE READER TRIES TO FIND A STABLE TOKEN
# ══════════════════════════════════════════════════════════════════════════════
# When a phone is tapped, the reader detects ISO-DEP capability (SAK bit 5)
# and attempts to read NDEF data over ISO 14443-4:
#   1. Sends RATS → phone responds with ATS (ISO 14443-4 activation)
#   2. Sends SELECT Application (AID D2 76 00 00 85 01 01, the NFC Forum T4T AID)
#   3. If accepted: reads the CC file, then the NDEF file
#   4. Extracts a stable token from the NDEF content:
#        • HA tag UUID  — https://www.home-assistant.io/tag/<UUID> → just the UUID
#        • First-record payload — URI or text string from the first NDEF record
#        • Hex fallback — raw NDEF bytes if no printable payload
#
# ══════════════════════════════════════════════════════════════════════════════
# CRITICAL: THE NDEF DATA IS NOT AUTO-POPULATED
# ══════════════════════════════════════════════════════════════════════════════
# The NFC Forum T4T AID (D2 76 00 00 85 01 01) is NOT served by phones by
# default.  Without a specific app, the phone will respond to RATS (step 1
# above), but return SW=6A82 "Application Not Found" for the SELECT (step 2).
#
# To serve NDEF to this reader, the user must install a dedicated Android HCE
# (Host Card Emulation) app that:
#   • Registers for the NFC Forum T4T AID (D2 76 00 00 85 01 01)
#   • Is running in the foreground or has an enabled HCE service
#   • Has been configured with the credential payload (see below)
#
# Popular apps that support this:
#   • "NFC Card Emulator" (Android, some versions require root)
#   • "CardEmulator" (Android)
#   • A custom Android app with HostApduService (developer option)
#
# ══════════════════════════════════════════════════════════════════════════════
# DOES THE TOKEN REPRESENT THE PERSON OR THE HARDWARE?
# ══════════════════════════════════════════════════════════════════════════════
# The short answer: IT DEPENDS ON WHAT YOU PUT IN THE NDEF PAYLOAD.
#
# Scenario A — Auto-generated UUID (hardware-tied, NOT recommended):
#   Some HCE apps auto-generate a UUID per installation.
#   When the user gets a new phone, the UUID changes → access breaks → re-enroll.
#   The token represents the phone installation, not the person.
#
# Scenario B — User-chosen credential string (person-tied, RECOMMENDED):
#   Configure the HCE app with a string the person chooses and remembers, e.g.:
#     "alice@home" or "https://yoursite.com/person/alice"
#   When Alice gets a new phone:
#     1. Install the HCE app on the new phone
#     2. Configure the same credential string "alice@home"
#     3. No re-enrollment needed — the same token → same access
#   The token represents the person, not the hardware.
#
# RECOMMENDATION: always choose a manually-configured, person-specific string
# as the credential in the HCE app.  Treat it like a password for your NFC
# access system — document it somewhere safe.
#
# ══════════════════════════════════════════════════════════════════════════════
# APPLE WALLET / GOOGLE PAY / CONTACTLESS PAYMENT APPS
# ══════════════════════════════════════════════════════════════════════════════
# Standard wallet apps (Apple Wallet, Google Pay) do NOT use the NFC Forum T4T
# AID.  They use proprietary protocols:
#   • Apple Wallet passes → Apple VAS (Value Added Services) protocol
#   • Google Wallet / Android Pay → Google Smart Tap protocol
#   • Contactless payment → EMVCo protocol
# None of these are supported by this reader yet.  Implementing VAS or Smart Tap
# requires registration with Apple/Google and cryptographic key management.
#
# ══════════════════════════════════════════════════════════════════════════════
# PRACTICAL SETUP WORKFLOW
# ══════════════════════════════════════════════════════════════════════════════
# 1. Install a supported Android HCE app on the phone
# 2. In the app, create a URI record or Text record with a PERSON-SPECIFIC string,
#    e.g.: "https://home.example.com/access/alice"
#    (This is the credential Alice carries.  It should be stable and unique.)
# 3. Enable the HCE service in the app
# 4. Tap the phone to the ST25R reader
# 5. Check ESPHome logs for the detected token:
#      [I][st25r:???]: ISO-DEP: NDEF payload token: https://home.example.com/access/alice
# 6. Use that string as the 'uid' in the binary sensor below
# ══════════════════════════════════════════════════════════════════════════════

esphome:
  name: st25r-wallet-example
  friendly_name: ST25R Wallet Example

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6

logger:
  level: INFO  # Set DEBUG to trace the full ISO-DEP / NDEF exchange on first setup

wifi:
  ssid: "WIFI_SSID"
  password: "WIFI_PASSWORD"

external_components:
  - source: github://JohnMcLear/esphome_st25r
    components: [st25r, st25r_spi]

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO10

st25r_spi:
  id: nfc_reader
  cs_pin: GPIO6
  irq_pin: GPIO7
  update_interval: 1s

  on_tag:
    then:
      - logger.log:
          format: "NFC token: %s"
          args: ['x.c_str()']
      # Optionally forward the token to Home Assistant for use in automations:
      - homeassistant.event:
          event: esphome.nfc_token
          data:
            token: !lambda 'return x;'

  on_tag_removed:
    then:
      - logger.log:
          format: "NFC removed: %s"
          args: ['x.c_str()']

# Binary sensors — set uid to the person-specific credential string you
# configured in the HCE app.  Use the exact string that appears in the logs.
#
# For a URI record: uid is the full URI, e.g.:
#   uid: "https://home.example.com/access/alice"
# For a text record: uid is the exact text, e.g.:
#   uid: "alice@home"
# For an HA tag URL: uid is just the UUID portion, e.g.:
#   uid: "abc12345-0000-1234-abcd-ef1234567890"
#
binary_sensor:
  - platform: st25r
    st25r_id: nfc_reader
    name: "Alice's Phone"
    uid: "https://home.example.com/access/alice"

  - platform: st25r
    st25r_id: nfc_reader
    name: "Bob's Phone"
    uid: "bob@home"
