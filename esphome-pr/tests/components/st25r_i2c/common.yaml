st25r_i2c:
  id: st25r_nfcc_i2c
  i2c_id: i2c_bus
  address: 0x50
  irq_pin: ${irq_pin}
  update_interval: 1s
  on_tag:
    then:
      - logger.log:
          format: "Tag scanned: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - logger.log:
          format: "Tag removed: %s"
          args: ['x.c_str()']

binary_sensor:
  - platform: st25r
    st25r_id: st25r_nfcc_i2c
    name: ST25R NFC Tag
    uid: 74-10-37-94
