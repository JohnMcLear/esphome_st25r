esphome:
  name: st25r-sim

host:

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../components
    components: [st25r, st25r_sim]

# Binary sensor — fires when UID FF112233 is in the field
binary_sensor:
  - platform: st25r
    st25r_id: reader1
    name: "NFC Tag FF112233"
    uid: "FF-11-22-33"
    on_state:
      - lambda: |-
          ESP_LOGI("emulation_test", "BINARY_SENSOR_STATE %d", (int)x);

# Reader 1 — primary reader exercised by most tests
st25r_sim:
  - id: reader1
    socket_path: /tmp/st25r_sim1.sock
    ic_identity: 0x28
    update_interval: 500ms
    miss_threshold: 3
    mifare_key_a: FFFFFFFFFFFF
    health_check_enabled: true
    health_check_interval: 2s
    max_failed_checks: 2
    auto_reset_on_failure: true
    status:
      name: "Reader1 Status"
      on_state:
        - lambda: |-
            ESP_LOGI("emulation_test", "READER1_STATUS %d", (int)x);
    field_strength:
      name: "Reader1 Field Strength"
      on_value:
        - lambda: |-
            ESP_LOGI("emulation_test", "READER1_FIELD_STRENGTH %.0f", x);
    on_tag:
      - lambda: |-
          ESP_LOGI("emulation_test", "READER1_ON_TAG %s", x.c_str());
          if (x == "CC-DD-EE-11-22-33-44") {
            bool ok = id(reader1).clean_tag();
            if (ok) { ESP_LOGI("emulation_test", "READER1_CLEAN_TAG_OK"); }
            else    { ESP_LOGW("emulation_test", "READER1_CLEAN_TAG_FAIL"); }
          }
      - logger.log:
          level: INFO
          format: "READER1_ON_TAG_ACTION %s"
          args: ['x.c_str()']
    on_tag_removed:
      - lambda: |-
          ESP_LOGI("emulation_test", "READER1_ON_TAG_REMOVED %s", x.c_str());
      - logger.log:
          level: INFO
          format: "READER1_ON_TAG_REMOVED_ACTION %s"
          args: ['x.c_str()']
    # ISO-DEP framing at the ST25R3916 length boundaries. The sim's test-only
    # ECHO APDU (80 EE 00 <n> [Lc data]) answers n bytes + 9000, or 6700 if the
    # command arrived shorter than its Lc says. Frame = PCB + APDU (+ CRC-A on
    # the reply), so these cover 31/32/33/63-byte commands and 63/64/65-byte
    # replies against the 64-byte receive buffer.
    on_isodep_tag:
      - lambda: |-
          auto run = [](const char *name, const std::vector<uint8_t> &apdu) {
            uint8_t resp[64];
            uint8_t len = 0;
            bool ok = id(reader1).send_apdu(apdu.data(), apdu.size(), resp, len);
            uint8_t sw1 = (ok && len >= 2) ? resp[len - 2] : 0;
            uint8_t sw2 = (ok && len >= 2) ? resp[len - 1] : 0;
            ESP_LOGI("emulation_test", "ISODEP_APDU %s ok=%d len=%u sw=%02X%02X", name, (int) ok, len, sw1, sw2);
          };
          auto echo = [](uint8_t reply_len, uint8_t lc) {
            std::vector<uint8_t> apdu = {0x80, 0xEE, 0x00, reply_len};
            if (lc > 0) {
              apdu.push_back(lc);
              for (uint8_t i = 0; i < lc; i++) apdu.push_back((uint8_t) (0xA0 + i));
            }
            return apdu;
          };
          run("tx31", echo(4, 25));
          run("tx32", echo(4, 26));
          run("tx33", echo(4, 27));
          run("tx63", echo(4, 57));
          run("rx63", echo(60, 0));
          run("rx64", echo(61, 0));
          run("rx65", echo(62, 0));

  # Reader 2 — separate socket path; used to test multiple-reader scenarios
  - id: reader2
    socket_path: /tmp/st25r_sim2.sock
    ic_identity: 0x28
    update_interval: 500ms
    on_tag:
      - lambda: |-
          ESP_LOGI("emulation_test", "READER2_ON_TAG %s", x.c_str());
    on_tag_removed:
      - lambda: |-
          ESP_LOGI("emulation_test", "READER2_ON_TAG_REMOVED %s", x.c_str());
