esphome:
  name: st25r-spi-ci-test
  friendly_name: ST25R SPI CI Test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: "CI_DUMMY_SSID"
  password: "CI_DUMMY_PASSWORD"

external_components:
  - source:
      type: local
      path: ../components
    components: [st25r, st25r_i2c, st25r_spi]
    refresh: 0s

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

st25r_spi:
  id: st25r_board
  cs_pin: GPIO5
  update_interval: 1s
  rf_field_enabled: true
  status:
    name: "ST25R SPI Health"
  field_strength:
    name: "ST25R SPI Field Strength"
  on_tag:
    then:
      - logger.log:
          format: "Tag scanned: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - logger.log:
          format: "Tag removed: %s"
          args: ['x.c_str()']

binary_sensor:
  - platform: st25r
    st25r_id: st25r_board
    name: "Test Badge SPI"
    uid: "01-02-03-04"

# Compile coverage for st25r.set_rf_field. Exercises both spellings, since
# they take different paths through maybe_simple_value(), and the templated
# lambda form, which is the one that instantiates TEMPLATABLE_VALUE and so
# fails to compile if the action's value type ever drifts from bool.
switch:
  - platform: template
    name: "RF Field"
    optimistic: true
    turn_on_action:
      - st25r.set_rf_field: true
    turn_off_action:
      - st25r.set_rf_field:
          id: st25r_board
          field_on: false

interval:
  - interval: 60s
    then:
      - st25r.set_rf_field:
          id: st25r_board
          field_on: !lambda 'return true;'
