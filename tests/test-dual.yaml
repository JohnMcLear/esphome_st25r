esphome:
  name: st25r-dual-test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "n"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source:
      type: local
      path: ../components
    components: [st25r, st25r_i2c]

output:
  - platform: gpio
    pin: GPIO2
    id: led

i2c:
  sda: 21
  scl: 22
  scan: true
  frequency: 100khz

st25r_i2c:
  id: st25r_i2c_board
  address: 0x50
  irq_pin: 5
  update_interval: 1s
  on_tag:
    then:
      - output.turn_on: led
      - logger.log:
          format: "I2C Tag detected: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - output.turn_off: led
      - logger.log:
          format: "I2C Tag removed: %s"
          args: ['x.c_str()']

