esphome:
  name: st25r300-spi-ci-test
  friendly_name: ST25R300 SPI CI Test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: "CI_DUMMY_SSID"
  password: "CI_DUMMY_PASSWORD"

external_components:
  - source:
      type: local
      path: ../components
    components: [st25r, st25r300, st25r300_spi]
    refresh: 0s

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

st25r300_spi:
  id: st25r300_board
  cs_pin: GPIO5
  update_interval: 1s
  rf_field_enabled: true
  status:
    name: "ST25R300 SPI Health"
  field_strength:
    name: "ST25R300 SPI Field Strength"
  on_tag:
    then:
      - logger.log:
          format: "Tag scanned: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - logger.log:
          format: "Tag removed: %s"
          args: ['x.c_str()']

binary_sensor:
  - platform: st25r
    st25r_id: st25r300_board
    name: "Test Badge ST25R300 SPI"
    uid: "01-02-03-04"

# Compile coverage for st25r300.set_rf_field. Worth having separately from the
# st25r twin in ci-test-spi.yaml: the ST25R300 overrides set_rf_field() in C++
# because its enable bits sit in REG_OPERATION (0x00) rather than the 3916's
# OP_CONTROL (0x02), so this is the config that actually builds the override.
switch:
  - platform: template
    name: "RF Field"
    optimistic: true
    turn_on_action:
      - st25r300.set_rf_field: true
    turn_off_action:
      - st25r300.set_rf_field:
          id: st25r300_board
          field_on: false

interval:
  - interval: 60s
    then:
      - st25r300.set_rf_field:
          id: st25r300_board
          field_on: !lambda 'return true;'
