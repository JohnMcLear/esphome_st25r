esphome:
  name: st25r300-spi-ci-test
  friendly_name: ST25R300 SPI CI Test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

wifi:
  ssid: "CI_DUMMY_SSID"
  password: "CI_DUMMY_PASSWORD"

external_components:
  - source:
      type: local
      path: ../components
    components: [st25r, st25r300, st25r300_spi]
    refresh: 0s

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

st25r300_spi:
  id: st25r300_board
  cs_pin: GPIO5
  update_interval: 1s
  rf_field_enabled: true
  status:
    name: "ST25R300 SPI Health"
  field_strength:
    name: "ST25R300 SPI Field Strength"
  on_tag:
    then:
      - logger.log:
          format: "Tag scanned: %s"
          args: ['x.c_str()']
  on_tag_removed:
    then:
      - logger.log:
          format: "Tag removed: %s"
          args: ['x.c_str()']

binary_sensor:
  - platform: st25r
    st25r_id: st25r300_board
    name: "Test Badge ST25R300 SPI"
    uid: "01-02-03-04"
